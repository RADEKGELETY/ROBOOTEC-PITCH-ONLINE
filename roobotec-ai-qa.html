<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROBOOTEC.AI — Investor Q&amp;A</title>
<meta name="description" content="ROBOOTEC.AI investor Q&A covering product, market, business model, traction, milestones and risks." />
<meta property="og:title" content="ROBOOTEC.AI — Investor Q&A" />
<meta property="og:description" content="Investor Q&A for ROBOOTEC.AI." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0a0a0a;--ink-soft:#1d1d1f;--gray:#86868b;--gray-line:#e8e8ea;
    --gray-faint:#f5f5f7;--gold:#4C63FF;--gold-soft:#CDD3FF;--white:#ffffff;
    --max:1120px;--ease:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5}

  .deck{height:100vh;overflow-y:scroll;scroll-snap-type:y proximity;scroll-behavior:smooth;scrollbar-width:none;background:var(--white)}
  .deck::-webkit-scrollbar{display:none}
  section{min-height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:104px 40px;position:relative;overflow:hidden;background:var(--white)}
  .wrap{width:100%;max-width:var(--max);margin:0 auto}

  .eyebrow{font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold);margin-bottom:22px}
  h1{font-size:clamp(2.6rem,6.4vw,5.2rem);font-weight:600;letter-spacing:-.035em;line-height:1.02}
  .lead{font-size:clamp(1.05rem,1.7vw,1.35rem);color:var(--gray);font-weight:400;line-height:1.6;max-width:620px}
  .gold{color:var(--gold)}

  /* reveal */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .reveal.d1{transition-delay:.09s}.reveal.d2{transition-delay:.18s}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html,.deck{scroll-behavior:auto}}

  /* chrome */
  .progress{position:fixed;top:0;left:0;height:2px;width:0%;background:var(--gold);z-index:60;transition:width .12s linear}
  .brandbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px 40px;pointer-events:none}
  .brandbar .mark{font-weight:600;letter-spacing:-.02em;font-size:1rem;display:flex;align-items:center;gap:9px;pointer-events:auto;text-decoration:none;color:var(--ink)}
  .nav-logo{height:24px;width:auto;display:block}
  .nav-logo-icon{height:22px;width:auto;display:block}
  .hero-logo{height:56px;width:auto;display:block;margin:0 auto}
  .close-logo{height:52px;width:auto;display:block;margin:0 auto}
  .dot-mark{width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .brandbar .right{display:flex;align-items:center;gap:18px;pointer-events:auto}
  .brandbar .meta{font-size:.78rem;color:var(--gray);letter-spacing:.04em}
  .lang{display:flex;align-items:center;gap:9px;font-size:.82rem;font-weight:600;letter-spacing:.05em}
  .lang button{border:none;background:none;cursor:pointer;color:var(--gray);padding:0;font:inherit;transition:color .3s var(--ease)}
  .lang button:hover{color:var(--ink)}
  .lang button.active{color:var(--gold)}
  .lang .bar{color:var(--gray-line);font-weight:400}

  nav.dots{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:12px}
  nav.dots button{width:8px;height:8px;border-radius:50%;border:none;cursor:pointer;background:var(--gray-line);padding:0;transition:all .35s var(--ease);position:relative}
  nav.dots button:hover{background:var(--gold-soft)}
  nav.dots button.active{background:var(--gold);transform:scale(1.3)}
  nav.dots button::after{content:attr(data-label);position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:.72rem;color:var(--gray);opacity:0;pointer-events:none;transition:opacity .25s}
  nav.dots button:hover::after{opacity:1}

  .hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:40;font-size:.74rem;color:var(--gray);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
  .hint .key{border:1px solid var(--gray-line);border-radius:5px;padding:1px 6px;font-size:.7rem;color:var(--ink-soft)}
  .chev{width:16px;height:16px;animation:bob 1.8s var(--ease) infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

  /* cover — same hero look as the pitch intro slide */
  .cover{text-align:center}
  .cover .wrap{position:relative;z-index:2}
  .cover h1{margin:0 auto}
  .cover .sub{margin:30px auto 0;max-width:560px}
  .net{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none}
  .net svg{width:min(1100px,92vw);height:auto;opacity:.9}
  .pulse{animation:pulse 3.4s ease-in-out infinite}
  .pulse.b{animation-delay:1.1s}.pulse.c{animation-delay:2.2s}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* closing — same as the pitch final slide */
  .closing{text-align:center}
  .iconic{font-size:clamp(2.8rem,8.2vw,6.4rem);font-weight:600;letter-spacing:-.045em;line-height:1.03}
  .iconic-brand{margin-top:clamp(44px,9vh,104px);font-size:clamp(1.2rem,2.6vw,1.9rem);font-weight:600;letter-spacing:.03em}
  .end-contact{margin-top:36px;display:flex;flex-direction:column;gap:7px;align-items:center}
  .end-contact .ec-name{font-size:.95rem;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .end-contact .ec-line{font-size:.9rem;color:var(--gray);display:flex;gap:11px;align-items:center;flex-wrap:wrap;justify-content:center}
  .end-contact a{color:var(--gold);text-decoration:none}
  .end-contact a:hover{text-decoration:underline}
  .end-contact .ec-sep{color:var(--gray-line)}

  /* Q&A slide — question on top, answer below (full width) */
  .qa{max-width:920px;margin:0 auto}
  .qa-head{margin-bottom:30px}
  .qa-q{font-size:clamp(1.8rem,3.2vw,2.7rem);font-weight:600;letter-spacing:-.025em;line-height:1.08}
  .qa-a p{font-size:clamp(1rem,1.25vw,1.14rem);line-height:1.65;color:var(--ink-soft)}
  .qa-a p+p{margin-top:16px}
  .qa-sub{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold);margin:26px 0 13px}
  .qa-a ul{list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:4px}
  .qa-a ul+p,.qa-a p+.qa-sub,.qa-a ul+.qa-sub{margin-top:24px}
  .qa-a li{font-size:clamp(.98rem,1.2vw,1.1rem);line-height:1.55;color:var(--ink-soft);display:flex;gap:13px;align-items:flex-start}
  .qa-a li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;margin-top:9px}

  @media (max-height:760px) and (min-width:900px){
    section{padding-top:72px;padding-bottom:38px}
    .qa-head{margin-bottom:20px}
    .qa-q{font-size:clamp(1.7rem,2.8vw,2.25rem)}
    .qa-a p{font-size:clamp(.95rem,1.05vw,1.04rem);line-height:1.52}
    .qa-a p+p{margin-top:11px}
    .qa-sub{margin:17px 0 9px}
    .qa-a ul{gap:8px}
    .qa-a li{font-size:clamp(.92rem,1vw,1rem);line-height:1.42}
  }

  @media (max-width:900px){
    section{padding:96px 24px}
    nav.dots{right:14px}
    .brandbar .meta{display:none}
    .hint{display:none}
  }

  @media print{
    @page{size:landscape;margin:0}
    html,body{height:auto}
    .deck{height:auto;overflow:visible;scroll-snap-type:none}
    .progress,nav.dots,.hint,.brandbar{display:none!important}
    section{min-height:auto;page-break-after:always;break-after:page;padding:56px 60px;display:block}
    .reveal{opacity:1!important;transform:none!important;transition:none!important}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    .chev,.pulse,.draw{animation:none!important}
  }
</style>
</head>

    a:[
      {p:{en:"Financial markets generate far more data than any human or traditional algorithm can process in real time. Every second, investment decisions are influenced by news, macroeconomic events, market data, company announcements and alternative data sources. Most investors and financial institutions still rely on fragmented tools, manual analysis and static algorithms that cannot adapt to constantly changing market conditions.",
          cz:"Finanční trhy generují mnohem více dat, než dokáže kterýkoli člověk nebo tradiční algoritmus zpracovat v reálném čase. Každou vteřinu ovlivňují investiční rozhodnutí zprávy, makroekonomické události, tržní data, firemní oznámení a alternativní datové zdroje. Většina investorů a finančních institucí stále spoléhá na roztříštěné nástroje, ruční analýzu a statické algoritmy, které se nedokáží přizpůsobit neustále se měnícím tržním podmínkám."}},
      {p:{en:"The result is slower decision-making, inconsistent investment strategies and missed opportunities. Even professional investors spend countless hours analyzing information instead of making decisions based on continuously evolving market intelligence.",
          cz:"Výsledkem je pomalejší rozhodování, nekonzistentní investiční strategie a zmeškané příležitosti. I profesionální investoři tráví nespočet hodin analýzou informací namísto rozhodování na základě průběžně se vyvíjející tržní inteligence."}},
      {p:{en:"We experienced this challenge firsthand while developing and validating quantitative trading strategies. Existing solutions either provide isolated trading signals or generic AI assistants, but none orchestrate specialized AI agents into a transparent, explainable decision-making system.",
          cz:"Tuto výzvu jsme zažili na vlastní kůži při vývoji a validaci kvantitativních obchodních strategií. Existující řešení buď poskytují izolované obchodní signály, nebo generické AI asistenty, ale žádné neorchestruje specializované AI agenty do transparentního, vysvětlitelného rozhodovacího systému."}},
      {p:{en:"ROBOOTEC.AI solves this by transforming fragmented market data into autonomous, explainable investment decisions through a coordinated network of specialized AI agents.",
          cz:"ROBOOTEC.AI to řeší tím, že proměňuje roztříštěná tržní data na autonomní a vysvětlitelná investiční rozhodnutí prostřednictvím koordinované sítě specializovaných AI agentů."}}
    ]},

  { label:{en:"Our solution",cz:"Naše řešení"},
    q:{en:"How do you solve this problem?", cz:"Jak tento problém řešíte?"},
    a:[
      {p:{en:"ROBOOTEC.AI replaces fragmented financial analysis with an autonomous AI decision-making infrastructure.",
          cz:"ROBOOTEC.AI nahrazuje roztříštěnou finanční analýzu autonomní AI rozhodovací infrastrukturou."}},
      {p:{en:"Our platform orchestrates specialized AI agents that continuously collect, analyze and validate real-time market data, generate predictive insights, select optimal investment strategies and manage portfolio risk. Every investment decision is transparent, explainable and continuously validated through backtesting, forward testing and paper trading before live deployment.",
          cz:"Naše platforma orchestruje specializované AI agenty, kteří nepřetržitě sbírají, analyzují a validují tržní data v reálném čase, generují prediktivní vhledy, vybírají optimální investiční strategie a řídí riziko portfolia. Každé investiční rozhodnutí je transparentní, vysvětlitelné a průběžně validované backtestem, forward testem a paper tradingem před nasazením naživo."}},
      {p:{en:"Unlike traditional trading platforms that provide isolated signals or static algorithms, ROBOOTEC.AI creates a complete AI-driven investment workflow—from data collection to autonomous decision support and execution.",
          cz:"Na rozdíl od tradičních obchodních platforem, které poskytují izolované signály nebo statické algoritmy, ROBOOTEC.AI vytváří kompletní AI investiční workflow — od sběru dat po autonomní podporu rozhodování a exekuci."}},
      {p:{en:"The same infrastructure powers both AI Vibe Trading for retail investors and enterprise solutions for financial institutions, enabling a scalable business model built on a single AI platform.",
          cz:"Stejná infrastruktura pohání jak AI Vibe Trading pro retailové investory, tak enterprise řešení pro finanční instituce, což umožňuje škálovatelný obchodní model postavený na jedné AI platformě."}}
    ]},

  { label:{en:"How it works",cz:"Jak to funguje"},
    q:{en:"How does your product or service work?", cz:"Jak váš produkt nebo služba funguje?"},
    a:[
      {p:{en:"ROBOOTEC.AI operates as an AI-powered decision infrastructure that transforms complex financial data into autonomous investment intelligence.",
          cz:"ROBOOTEC.AI funguje jako rozhodovací infrastruktura poháněná AI, která transformuje komplexní finanční data na autonomní investiční inteligenci."}},
      {p:{en:"The platform continuously processes real-time market data, news, macroeconomic events and alternative data sources through a network of specialized AI agents. Each agent performs a specific task—from market analysis and predictive modeling to strategy selection, validation and portfolio risk management.",
          cz:"Platforma nepřetržitě zpracovává tržní data v reálném čase, zprávy, makroekonomické události a alternativní datové zdroje prostřednictvím sítě specializovaných AI agentů. Každý agent plní konkrétní úkol — od analýzy trhu a prediktivního modelování po výběr strategie, validaci a řízení rizika portfolia."}},
      {p:{en:"Before any strategy reaches production, it is continuously validated through backtesting, forward testing and paper trading to ensure robustness under different market conditions.",
          cz:"Než se jakákoli strategie dostane do produkce, je průběžně validována backtestem, forward testem a paper tradingem, aby byla zajištěna robustnost za různých tržních podmínek."}},
      {sub:{en:"Key features",cz:"Klíčové funkce"}},
      {ul:[
        {en:"Multi-agent AI architecture for autonomous decision support", cz:"Multi-agentní AI architektura pro autonomní podporu rozhodování"},
        {en:"Real-time market intelligence and predictive analytics", cz:"Tržní inteligence a prediktivní analytika v reálném čase"},
        {en:"Explainable AI with transparent investment reasoning", cz:"Vysvětlitelná AI s transparentním investičním zdůvodněním"},
        {en:"Automated strategy validation and optimization", cz:"Automatizovaná validace a optimalizace strategií"},
        {en:"Integrated risk management and portfolio monitoring", cz:"Integrované řízení rizik a monitoring portfolia"},
        {en:"One scalable platform serving both retail investors and financial institutions", cz:"Jedna škálovatelná platforma sloužící retailovým investorům i finančním institucím"}
      ]},
      {p:{en:"This architecture enables faster, more consistent and data-driven investment decisions while reducing manual analysis and emotional bias.",
          cz:"Tato architektura umožňuje rychlejší, konzistentnější a datově řízená investiční rozhodnutí a zároveň snižuje ruční analýzu a emocionální zkreslení."}}
    ]},

  { label:{en:"Key innovation",cz:"Klíčová inovace"},
    q:{en:"What is the key innovation?", cz:"Co je klíčová inovace?"},
    a:[
      {p:{en:"Our innovation is not a single AI model—it is the orchestration of specialized AI agents into one autonomous decision-making infrastructure.",
          cz:"Naší inovací není jeden AI model — je to orchestrace specializovaných AI agentů do jedné autonomní rozhodovací infrastruktury."}},
      {p:{en:"Instead of relying on a general-purpose language model or static trading algorithms, ROBOOTEC.AI combines multiple AI agents, each responsible for a specific task such as market intelligence, predictive analytics, strategy generation, validation, portfolio optimization and risk management. Together they create a continuous decision-making pipeline rather than isolated AI outputs.",
          cz:"Místo spoléhání na univerzální jazykový model nebo statické obchodní algoritmy kombinuje ROBOOTEC.AI více AI agentů, z nichž každý odpovídá za konkrétní úkol, jako je tržní inteligence, prediktivní analytika, tvorba strategií, validace, optimalizace portfolia a řízení rizik. Společně vytvářejí kontinuální rozhodovací pipeline namísto izolovaných AI výstupů."}},
      {p:{en:"A key differentiator is our validation-first approach. Every strategy is continuously evaluated through backtesting, forward testing and paper trading before deployment, creating a feedback loop that improves system reliability and transparency.",
          cz:"Klíčovým odlišením je náš přístup s validací na prvním místě. Každá strategie je před nasazením průběžně vyhodnocována backtestem, forward testem a paper tradingem, což vytváří zpětnovazební smyčku, která zvyšuje spolehlivost a transparentnost systému."}},
      {p:{en:"The platform is designed as modular AI infrastructure, allowing new agents, data sources and investment strategies to be integrated without redesigning the core architecture. This enables us to scale from a single investment application to an enterprise-grade platform for autonomous capital management.",
          cz:"Platforma je navržena jako modulární AI infrastruktura, která umožňuje integrovat nové agenty, datové zdroje a investiční strategie bez přepracování jádra architektury. To nám umožňuje škálovat od jediné investiční aplikace po platformu enterprise úrovně pro autonomní správu kapitálu."}},
      {p:{en:"Our long-term competitive advantage lies in the combination of multi-agent orchestration, explainable AI, continuous validation and a unified infrastructure serving both retail and institutional markets.",
          cz:"Naše dlouhodobá konkurenční výhoda spočívá v kombinaci multi-agentní orchestrace, vysvětlitelné AI, průběžné validace a jednotné infrastruktury sloužící retailovému i institucionálnímu trhu."}}
    ]},

  { label:{en:"Why now",cz:"Proč teď"},
    q:{en:"Why is now good timing for your business?", cz:"Proč je teď dobré načasování pro váš byznys?"},
    a:[
      {p:{en:"The timing for ROBOOTEC.AI is driven by the convergence of three major technology shifts.",
          cz:"Načasování pro ROBOOTEC.AI žene souběh tří zásadních technologických posunů."}},
      {p:{en:"First, foundation AI models have evolved into autonomous AI agents capable of performing specialized tasks, enabling entirely new approaches to financial decision-making.",
          cz:"Zaprvé, základové AI modely se vyvinuly v autonomní AI agenty schopné plnit specializované úkoly, což umožňuje zcela nové přístupy k finančnímu rozhodování."}},
      {p:{en:"Second, financial markets have become increasingly data-intensive. The volume and complexity of market information now exceed what human analysts and traditional algorithms can efficiently process in real time.",
          cz:"Zadruhé, finanční trhy jsou stále náročnější na data. Objem a komplexita tržních informací nyní překračují to, co dokáží lidští analytici a tradiční algoritmy efektivně zpracovat v reálném čase."}},
      {p:{en:"Third, investors and financial institutions are actively seeking AI-powered solutions that improve decision quality, transparency and operational efficiency while reducing manual work.",
          cz:"Zatřetí, investoři a finanční instituce aktivně hledají AI řešení, která zlepšují kvalitu rozhodování, transparentnost a provozní efektivitu a zároveň snižují ruční práci."}},
      {p:{en:"These trends create a unique market opportunity for AI-native investment infrastructure. What was technically impossible just a few years ago is now becoming commercially viable.",
          cz:"Tyto trendy vytvářejí jedinečnou tržní příležitost pro AI-native investiční infrastrukturu. Co bylo před pár lety technicky nemožné, se nyní stává komerčně životaschopným."}},
      {p:{en:"We believe this is the right moment to build the intelligence layer for the next generation of autonomous capital management.",
          cz:"Věříme, že toto je správný okamžik postavit inteligenční vrstvu pro novou generaci autonomní správy kapitálu."}}
    ]},

  { label:{en:"Competition",cz:"Konkurence"},
    q:{en:"Who are your main competitors and why are you better?", cz:"Kdo jsou vaši hlavní konkurenti a proč jste lepší?"},
    a:[
      {p:{en:"Our competition falls into three categories.",
          cz:"Naše konkurence spadá do tří kategorií."}},
      {p:{en:"Traditional market intelligence platforms (such as Bloomberg Terminal and TradingView) provide access to financial data and analytics but leave the decision-making process to the user.",
          cz:"Tradiční platformy tržní inteligence (jako Bloomberg Terminal a TradingView) poskytují přístup k finančním datům a analytice, ale rozhodovací proces nechávají na uživateli."}},
      {p:{en:"Algorithmic trading platforms offer automation based on predefined rules but typically lack adaptive AI reasoning, explainability and continuous strategy validation.",
          cz:"Algoritmické obchodní platformy nabízejí automatizaci založenou na předdefinovaných pravidlech, ale obvykle jim chybí adaptivní AI uvažování, vysvětlitelnost a průběžná validace strategií."}},
      {p:{en:"AI-powered trading assistants generate market insights or trading signals, but they usually operate as isolated tools rather than autonomous decision-making systems.",
          cz:"AI obchodní asistenti generují tržní vhledy nebo obchodní signály, ale obvykle fungují jako izolované nástroje, nikoli jako autonomní rozhodovací systémy."}},
      {p:{en:"ROBOOTEC.AI combines these capabilities into a single AI-native infrastructure. Our platform orchestrates specialized AI agents across the entire investment workflow—from market intelligence and predictive analytics to strategy validation, risk management and autonomous decision support.",
          cz:"ROBOOTEC.AI kombinuje tyto schopnosti do jedné AI-native infrastruktury. Naše platforma orchestruje specializované AI agenty napříč celým investičním workflow — od tržní inteligence a prediktivní analytiky po validaci strategií, řízení rizik a autonomní podporu rozhodování."}},
      {p:{en:"Our competitive advantage is not a single AI model, but a modular multi-agent architecture, continuous validation pipeline and explainable AI designed to serve both retail investors and financial institutions on one scalable platform.",
          cz:"Naší konkurenční výhodou není jeden AI model, ale modulární multi-agentní architektura, průběžná validační pipeline a vysvětlitelná AI navržená tak, aby na jedné škálovatelné platformě sloužila retailovým investorům i finančním institucím."}}
    ]},

/* ============================ RENDER ============================ */
const deck=document.getElementById('deck');
const nodes=[];
function bind(el, pair){ el.innerHTML=pair.en; nodes.push({el, en:pair.en, cz:pair.cz}); }

QA.forEach((item, idx)=>{
  const sec=document.createElement('section');
  sec.dataset.label=item.label.en;
  const wrap=document.createElement('div'); wrap.className='wrap';

  if(item.cover){
    wrap.classList.add('cover');
    const net=document.createElement('div'); net.className='net'; net.setAttribute('aria-hidden','true'); net.innerHTML=NETSVG;
    sec.append(net);
    const eb=document.createElement('div'); eb.className='eyebrow reveal'; eb.innerHTML='<img class="hero-logo" src="'+LOGO_URI+'" alt="ROBOOTEC.AI">';
    const h=document.createElement('h1'); h.className='reveal d1'; bind(h, item.title);
    const s=document.createElement('p'); s.className='lead sub reveal d2'; bind(s, item.sub);
    wrap.append(eb,h,s);
  } else if(item.closing){
    wrap.classList.add('closing');
    const h=document.createElement('h1'); h.className='iconic reveal'; bind(h, item.h1);
    const brand=document.createElement('div'); brand.className='iconic-brand reveal d1'; brand.innerHTML='<img class="close-logo" src="'+LOGO_URI+'" alt="ROBOOTEC.AI">';
    const ec=document.createElement('div'); ec.className='end-contact reveal d2';
    const name=document.createElement('div'); name.className='ec-name';
    const roleSpan=document.createElement('span'); bind(roleSpan, item.role);
    name.append(document.createTextNode('Radek Gelety · '), roleSpan);
    const line=document.createElement('div'); line.className='ec-line';
    line.innerHTML='<a href="tel:+420777150218">+420 777 150 218</a><span class="ec-sep">·</span><a href="mailto:radek@robootec.ai">radek@robootec.ai</a>';
    ec.append(name, line);
    wrap.append(h, brand, ec);
  } else {
    wrap.classList.add('qa');
    const head=document.createElement('div'); head.className='qa-head reveal';
    const eb=document.createElement('div'); eb.className='eyebrow';
    const num=String(idx).padStart(2,'0');
    bind(eb, {en:num+' · '+item.label.en, cz:num+' · '+item.label.cz});
    const q=document.createElement('h2'); q.className='qa-q'; bind(q, item.q);
    head.append(eb,q);

    const ans=document.createElement('div'); ans.className='qa-a reveal d1';
    item.a.forEach(block=>{
      if(block.p){ const p=document.createElement('p'); bind(p, block.p); ans.append(p); }
      else if(block.sub){ const d=document.createElement('div'); d.className='qa-sub'; bind(d, block.sub); ans.append(d); }
      else if(block.ul){ const ul=document.createElement('ul'); block.ul.forEach(li=>{ const l=document.createElement('li'); bind(l, li); ul.append(l); }); ans.append(ul); }
    });
    wrap.append(head, ans);
  }
  sec.append(wrap); deck.append(sec);
});

/* ============================ NAV + I18N ============================ */
const sections=Array.from(deck.querySelectorAll('section'));
const progress=document.getElementById('progress');
const dotsNav=document.getElementById('dots');
const hint=document.getElementById('hint');

sections.forEach((s,i)=>{
  const b=document.createElement('button');
  b.dataset.label=s.dataset.label||('Section '+(i+1));
  b.setAttribute('aria-label','Go to '+b.dataset.label);
  b.addEventListener('click',()=>goTo(i));
  dotsNav.appendChild(b);
});
const dots=Array.from(dotsNav.children);

let current=0;
const initialHash = location.hash;
let allowHashSync = false;
function setHash(i){
  if(!allowHashSync) return;
  if(sections[i]) history.replaceState(null,'','#q-'+(i+1));
}
function goTo(i, updateHash=true){
  i=Math.max(0,Math.min(sections.length-1,i));
  sections[i].scrollIntoView({behavior:'smooth'});
  if(updateHash) setHash(i);
}

const io=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
      const idx=sections.indexOf(e.target);
      if(idx>-1){
        current=idx;
        dots.forEach((d,k)=>d.classList.toggle('active',k===idx));
        setHash(idx);
      }
    }
  });
},{threshold:.3});
sections.forEach(s=>io.observe(s));

deck.addEventListener('scroll',()=>{
  const max=deck.scrollHeight-deck.clientHeight;
  progress.style.width=(deck.scrollTop/max*100)+'%';
  hint.style.opacity = deck.scrollTop>40 ? '0':'1';
},{passive:true});

window.addEventListener('keydown',(e)=>{
  if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();goTo(current+1);}
  else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();goTo(current-1);}
  else if(e.key==='Home'){e.preventDefault();goTo(0);}
  else if(e.key==='End'){e.preventDefault();goTo(sections.length-1);}
});

const metaEl=document.getElementById('meta');
const hintText=document.getElementById('hinttext');
const langBtns=Array.from(document.querySelectorAll('#lang button'));
function setLang(lang){
  nodes.forEach(n=> n.el.innerHTML = n[lang] != null ? n[lang] : n.en);
  metaEl.innerHTML = M.meta[lang] || M.meta.en;
  hintText.innerHTML = M.hint[lang] || M.hint.en;
  document.documentElement.lang = (lang==='cz') ? 'cs' : lang;
  langBtns.forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
}
langBtns.forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

window.addEventListener('load',()=>{
  const m = initialHash.match(/^#q-(\d+)$/);
  const startIndex = m ? Math.max(0, Math.min(sections.length-1, parseInt(m[1],10)-1)) : 0;
  if(startIndex) goTo(startIndex, false);
  sections[startIndex].querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
  dots[startIndex].classList.add('active');
  window.setTimeout(()=>{ allowHashSync = true; setHash(startIndex); }, 350);
});
</script>
